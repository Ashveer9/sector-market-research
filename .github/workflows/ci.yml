name: CI — Sector Market Research Pipeline

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  DUCKDB_PATH: "data/test_warehouse.duckdb"

jobs:
  # ── Code quality ────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install ruff==0.4.10 black==24.4.2 isort==5.13.2

      - name: Ruff — lint
        run: ruff check src/ scripts/ tests/

      - name: Black — format check
        run: black --check src/ scripts/ tests/

      - name: isort — import ordering
        run: isort --check-only src/ scripts/ tests/

  # ── Type checking ───────────────────────────────────────────────────────────
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: |
          pip install \
            pandas==2.2.2 pyarrow==16.1.0 duckdb==0.10.3 numpy==1.26.4 \
            pyyaml==6.0.1 mypy==1.10.0 pandas-stubs==2.2.2.240514

      - name: mypy
        run: mypy src/ --ignore-missing-imports --no-strict-optional

  # ── Unit tests ──────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install \
            pandas==2.2.2 pyarrow==16.1.0 duckdb==0.10.3 numpy==1.26.4 \
            pyyaml==6.0.1 python-dotenv==1.0.1 \
            pytest==8.2.2 pytest-cov==5.0.0 pytest-mock==3.14.0 faker==25.2.0

      - name: Create data dirs
        run: mkdir -p data/{raw,processed,analytics,sample} logs

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v \
            --tb=short \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── Integration tests ────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests (Full Pipeline)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install \
            pandas==2.2.2 pyarrow==16.1.0 duckdb==0.10.3 numpy==1.26.4 \
            pyyaml==6.0.1 python-dotenv==1.0.1 \
            pytest==8.2.2 pytest-cov==5.0.0 faker==25.2.0

      - name: Create data dirs
        run: mkdir -p data/{raw,processed,analytics,sample} logs

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v \
            --tb=short \
            --timeout=120

  # ── dbt compile check ────────────────────────────────────────────────────────
  dbt-compile:
    name: dbt Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dbt
        run: pip install dbt-core==1.8.4 dbt-duckdb==1.8.1

      - name: Create dummy DB
        run: |
          mkdir -p data
          python -c "import duckdb; duckdb.connect('data/test_warehouse.duckdb').close()"

      - name: dbt compile (validate SQL)
        working-directory: dbt
        env:
          DUCKDB_PATH: "../data/test_warehouse.duckdb"
        run: dbt compile --profiles-dir . --project-dir .

  # ── Docker build ─────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: sector-market-research:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
