[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sector-market-research"
version = "1.0.0"
description = "End-to-end Medallion Architecture data pipeline for global sector market research"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Data Engineering" }]
keywords = ["data-engineering", "etl", "duckdb", "medallion", "airflow", "dbt"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B008", "N803", "N806"]
exclude = ["dbt/target", "dbt/dbt_packages", ".venv"]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = "dbt/target|dbt/dbt_packages"

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["dbt/target/*", "dbt/dbt_packages/*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["dbt/", "airflow/"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*", "dbt/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
