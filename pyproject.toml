[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sector-market-research"
version = "0.1.0"
description = "A self-correcting multi-agent system that writes source-backed market-research reports with Claude."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ashveer" }]
keywords = ["agentic-ai", "claude", "anthropic", "market-research", "multi-agent"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    # Uses adaptive-thinking, output_config, messages.parse, and the
    # web_search_20260209 tool types — all present from 0.115 onward.
    "anthropic>=0.115",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
sector-research = "sector_research.cli:main"

[project.urls]
Repository = "https://github.com/ashveer9/sector-market-research"

[tool.hatch.build.targets.wheel]
packages = ["src/sector_research"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
packages = ["sector_research"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=sector_research --cov-report=term-missing"
pythonpath = ["src"]
